spring:
  application:
    name: notifications-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: jdbc:mysql://localhost:3306/notifications_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notifications-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  mail:
    host: ${EMAIL_HOST:${SPRING_MAIL_HOST:smtp.gmail.com}}
    port: ${EMAIL_PORT:${SPRING_MAIL_PORT:587}}
    username: ${EMAIL_USER:${SPRING_MAIL_USERNAME:}}
    password: ${EMAIL_PASS:${SPRING_MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8087
  servlet:
    context-path: /api

# WebSocket endpoints (no context-path prefix — Spring WebSocket bypasses the servlet context):
#   Raw WS  : ws://[host]/ws/kitchen/{branchId}
#             ws://[host]/ws/orders/{orderId}
#             ws://[host]/ws/manager/{branchId}
#   STOMP   : ws://[host]/ws-notifications  (subscribe to /topic/customer/{customerId})

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  brevo:
    api-key: ${BREVO_API_KEY:}
    sender-email: ${BREVO_SENDER_EMAIL:}
    sender-name: ${BREVO_SENDER_NAME:FoodChain}

logging:
  level:
    root: INFO
    com.microservices: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: false
